name: Ebook

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
    paths:
      - 'scripts/**'
      - 'app/diagram-snapshot/**'
      - 'components/diagrams/**'
      - 'lib/exercises*.ts'
      - 'lib/program.ts'
      - '.github/workflows/ebook.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ePub + PDF
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: astral-sh/setup-uv@v6

      - name: Install system dependencies (Cairo + Calibre)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info \
            calibre

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          uv run --python 3.14 --with playwright python -m playwright install chromium --with-deps

      - name: Build ebook
        env:
          NEXT_PUBLIC_FEATURE_AI_SUGGESTIONS: "false"
          AUTH_TRUST_HOST: "true"
        run: bash scripts/build-ebook.sh

      - name: Summary
        run: |
          echo "## Ebook artifacts" >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/nwb-plan.* 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Diagram snapshots: $(ls dist/diagrams 2>/dev/null | wc -l)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: nwb-plan-ebook
          path: |
            dist/nwb-plan.epub
            dist/nwb-plan.pdf
          retention-days: 30

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nwb-plan.epub
            dist/nwb-plan.pdf
          fail_on_unmatched_files: false
          draft: false
          generate_release_notes: true
