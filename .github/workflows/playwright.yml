name: Playwright Tests

on:
  # Run on every push and every PR — feature branches get tested before
  # merge time, not after a PR is opened. concurrency.cancel-in-progress
  # below ensures rapid pushes to the same ref don't pile up runs.
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watch-build:
    name: Wear OS App Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Export exercise data for watch
        run: |
          npx ts-node --skip-project \
            --compiler-options '{"module":"commonjs","esModuleInterop":true,"types":["node"],"moduleResolution":"node"}' \
            watch/scripts/export-data.ts

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: watch
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: watch-debug-apk
          path: watch/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  e2e:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: astral-sh/setup-uv@v6

      - name: Install Node dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_FEATURE_AI_SUGGESTIONS: "false"
          AUTH_TRUST_HOST: "true"

      - name: Install Playwright browsers
        run: uv run --python 3.14 --with pytest --with pytest-playwright --with playwright python -m playwright install chromium --with-deps

      - name: Run Playwright tests
        env:
          AUTH_TRUST_HOST: "true"
          EXERCISE_API_TOKEN: "ci-test-token-deadbeef"
        run: |
          npm run start &
          SERVER_PID=$!

          # Wait up to 60s for server to be ready
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Server did not start in time"
              exit 1
            fi
            sleep 1
          done

          uv run --python 3.14 --with pytest --with pytest-playwright --with playwright pytest e2e/ -v --tracing=retain-on-failure --output=test-results

          kill $SERVER_PID || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: test-results/
          retention-days: 14
